services:
  db:
    image: postgres:16
    container_name: carbon-compass-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: carbon
      POSTGRES_PASSWORD: carbon
      POSTGRES_DB: carbon_compass
    ports:
      - '55432:5432'
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U carbon -d carbon_compass']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db_data:
